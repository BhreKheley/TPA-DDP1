{% extends "base.html" %}
{% from "macros/icons.html" import icon %}

{% block title %}Error {{ code }} | Smart Meal Finder{% endblock %}

{% block content %}
<section class="error-container">
    <div class="error-card">
        <div class="error-status-badge tabular-nums">
            HTTP {{ code }}
        </div>
        <h1 class="error-heading">{{ title }}</h1>
        <p class="error-detail-text">{{ message }}</p>

        <div class="error-action-row">
            <a href="/" class="btn btn-primary">
                {{ icon("arrow-left", 16) }}
                <span>Kembali ke Pencarian</span>
            </a>
            <a href="/merchants" class="btn btn-outline-slate">
                Lihat Daftar Kantin
            </a>
        </div>
    </div>
</section>
{% endblock %}
