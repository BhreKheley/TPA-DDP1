{% extends "base.html" %}
{% from "macros/icons.html" import icon %}

{% block title %}Error {{ code }} - {{ title }}{% endblock %}

{% block content %}
<section class="error-container">
    <div class="card error-card">
        <div class="error-status-badge">
            <span class="error-code-num">{{ code }}</span>
        </div>
        <h1 class="error-heading">{{ title }}</h1>
        <p class="error-detail-text">{{ message }}</p>

        <div class="error-action-row">
            <a href="/" class="btn btn-primary btn-lg" style="background-color: #FFC700; color: #0F172A; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem;">
                {{ icon("arrow-left", 16) }} Kembali ke Beranda
            </a>
            <a href="/merchants" class="btn btn-outline">
                Lihat Daftar Kantin
            </a>
        </div>
    </div>
</section>
{% endblock %}
