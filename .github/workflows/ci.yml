name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tes dan lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 core app tests run.py --max-line-length=120
      - name: Validasi berkas data
        run: python -c "from core.loader import load_merchants; print(len(load_merchants('data/merchants.json')), 'merchant valid')"
      - name: Tes
        run: python -m pytest -q --cov=core --cov=app --cov-report=term-missing
