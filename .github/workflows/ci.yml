name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pytest-cov

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Lint codebase with max line length 120 (exit-zero treats stylistic warnings informatively)
          flake8 core app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Validate dataset schema
        run: |
          python -c "from core.loader import load_merchants; merchants = load_merchants('data/merchants.json', strict=True); print(f'Validated {len(merchants)} merchants successfully!')"

      - name: Run tests with pytest & coverage
        run: |
          pytest -v --cov=core --cov=app --cov-report=term-missing --cov-report=xml tests/
